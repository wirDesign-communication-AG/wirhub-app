name: 'CI PHP 8.4'
on:
    pull_request:
        branches: [ 'main', 'v3.2', 'v3.2.*' ]
jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/wirdesign-communication-ag/wirhub-app/test:latest
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        steps:
            -   name: Load project repository
                uses: actions/checkout@v6

            # The job runs as root inside the container while the workspace is owned by the
            # runner user, so git refuses to read it. actions/checkout only registers the
            # directory in the global config, which subprocesses like composer do not pick up.
            -   name: Mark workspace as a safe git directory
                run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

            -   name: Add GitHub OAuth credentials
                run: echo '${{ secrets.COMPOSER_AUTH_JSON }}' > $GITHUB_WORKSPACE/auth.json

            -   name: Install dependencies
                run: APP_ENV=test composer install --prefer-dist --no-progress --no-scripts

            # The bundle no longer commits Resources/public/<version>, and a dev-* requirement
            # resolves to a branch archive without it, so the assets are built here.
            # Full npm install: the build toolchain lives in the bundle's devDependencies.
            -   name: Build bundle assets
                run: |
                    npm --prefix ./vendor/wirdesign-communication-ag/wirhub/build ci
                    npm --prefix ./vendor/wirdesign-communication-ag/wirhub/build run build

            -   name: Install bundle DotEnv file
                run: cp vendor/wirdesign-communication-ag/wirhub/.env.github .env.test.local

            -   name: Verify some versions
                run: |
                    echo "-- Google Chrome --"
                    google-chrome --version
                    echo "-- Chromedriver --"
                    chromedriver --version
                    echo "-- Composer --"
                    composer --version
                    echo "-- PHP --"
                    php --version

            -   name: PHP CS Fixer
                run: php vendor/bin/php-cs-fixer check --stop-on-violation --config=.php-cs-fixer.dist.php

            -   name: Prepare symfony
                run: |
                    APP_ENV=test composer dump-env test
                    APP_ENV=test php bin/console cache:clear
                    APP_ENV=test php bin/console assets:install public/
                    APP_ENV=test php bin/console doctrine:schema:update --force
                    mkdir -p var/cache/test/sessions

            -   name: Test - Lint
                run: |
                    APP_ENV=test php bin/console lint:twig templates/
                    APP_ENV=test php bin/console lint:yaml config/
                    APP_ENV=test php bin/console lint:container

            -   name: Test - PHPStan
                run: vendor/bin/phpstan analyse -c phpstan.neon

            -   name: Test - App
                run: APP_ENV=test php bin/console app:test

            -   name: Test - WebTestCase and KernelTestCase
                run: php bin/phpunit -c phpunit.xml.dist vendor/wirdesign-communication-ag/wirhub/Tests/Cases/WebAndKernel/

            # APP_DEBUG=0 turns off the profiler and the query logging. That is
            # roughly a fifth of the runtime of the Panther suite, and none of
            # the tests looks at the collected data. variables_order=EGPCS is
            # what makes the built-in server read both variables from the
            # environment at all.
            -   name: Start Webserver for Panther
                run: APP_ENV=test APP_DEBUG=0 php -d variables_order=EGPCS -S localhost:8000 -t public/ > /tmp/php-server.log 2>&1 &

            -   name: Test - PantherTestCase
                run: php bin/phpunit -c phpunit.xml.dist vendor/wirdesign-communication-ag/wirhub/Tests/Cases/Panther/

            -   name: Archive debugging files
                uses: actions/upload-artifact@v7
                if: failure()
                with:
                    name: debug
                    if-no-files-found: ignore
                    path: |
                        .env.local.php
                        var/cache/*.log
                        var/cache/test/*.log
                        var/error-screenshots/*
                        var/log/*
                        var/wdc-styleguide.db
                        vendor/wirdesign-communication-ag/wirhub/build/debug/*
